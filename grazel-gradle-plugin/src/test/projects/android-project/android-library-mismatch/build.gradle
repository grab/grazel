apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace "com.grab.grazel.android.mismatch"
    compileSdkVersion 33
    buildToolsVersion "33.0.1"

    defaultConfig {
        minSdkVersion 16
    }

    flavorDimensions "service"
    productFlavors {
        paid {
            dimension "service"
        }
        free {
            dimension "service"
        }
    }
}

dependencies {
    paidImplementation "com.jakewharton.timber:timber:4.7.1"
    paidImplementation("androidx.constraintlayout:constraintlayout:2.0.1") {
        exclude group: "androidx.appcompat", module: "appcompat"
    }
    debugImplementation("javax.annotation:javax.annotation-api:1.3.2") {
        exclude group: "com.example", module: "selected-debug-only-exclude"
    }
    releaseImplementation("javax.annotation:javax.annotation-api:1.3.2") {
        exclude group: "com.example", module: "unselected-release-only-exclude"
    }
    freeImplementation "com.squareup.okio:okio:2.8.0"
    freeImplementation("androidx.constraintlayout:constraintlayout:2.0.1") {
        exclude group: "androidx.core", module: "core"
    }
}
