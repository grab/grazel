apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'

android {
    namespace "com.example.androidproject"
    compileSdkVersion 33
    buildToolsVersion "33.0.1"

    defaultConfig {
        applicationId "com.example.androidproject"
        minSdkVersion 16
        targetSdkVersion 32
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        dataBinding = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    flavorDimensions "service"
    productFlavors {
        flavor1 {
            dimension "service"
            matchingFallbacks = ["paid"]
        }
        flavor2 {
            dimension "service"
            matchingFallbacks = ["paid"]
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation project(":android-library-flavor")
    implementation project(":android-library")
    implementation project(":kotlin-library1")
    implementation project(":kotlin-library2")
    implementation project(":kotlin-library3")

    implementation 'androidx.core:core-ktx:1.3.1'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.1'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.1.0'
    implementation 'androidx.navigation:navigation-ui-ktx:2.1.0'
    implementation 'org.apache.commons:commons-lang3:3.9'
    debugImplementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'com.google.code.findbugs:jsr305:3.0.1'
    flavor2Implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation('com.google.j2objc:j2objc-annotations:1.1') {
        exclude group: 'com.example', module: 'main-only-exclude'
    }
    testImplementation 'junit:junit:4.12'
    testCompileOnly('commons-io:commons-io:2.11.0') {
        exclude group: 'com.example', module: 'same-project-test-only-exclude'
    }
    androidTestCompileOnly('com.google.j2objc:j2objc-annotations:1.3') {
        exclude group: 'com.example', module: 'android-test-only-exclude'
    }
    androidTestCompileOnly('commons-io:commons-io:2.11.0') {
        exclude group: 'com.example', module: 'same-project-android-test-only-exclude'
    }
    androidTestCompileOnly('org.hamcrest:hamcrest-library:1.3') {
        exclude group: 'com.example', module: 'android-test-only-hamcrest-exclude'
    }
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
}
