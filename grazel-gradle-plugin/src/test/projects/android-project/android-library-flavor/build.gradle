apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "kotlin-kapt"
apply plugin: "kotlin-parcelize"

android {
    namespace "com.grab.grazel.android.flavor"
    compileSdkVersion 33
    buildToolsVersion "33.0.1"

    flavorDimensions "service"
    productFlavors {
        flavor1 {
            dimension "service"
            matchingFallbacks = ["paid"]
        }
        flavor2 {
            dimension "service"
            matchingFallbacks = ["paid"]
        }
    }
}

dependencies {
    implementation project(":android-library-mismatch")

    flavor1Implementation project(path: ":kotlin-library-flavor1")
    flavor2Implementation project(path: ":kotlin-library-flavor2")

    implementation "androidx.appcompat:appcompat:1.1.0"
    implementation "androidx.constraintlayout:constraintlayout:1.1.3"
    implementation "com.google.dagger:dagger:2.28.1"
    implementation "com.google.j2objc:j2objc-annotations:1.1"
    flavor2CompileOnly "com.squareup.okhttp3:logging-interceptor:4.9.3"
    debugCompileOnly "com.squareup.okhttp3:okhttp-urlconnection:4.9.3"
    debugCompileOnly "org.apache.commons:commons-collections4:4.4"
    debugCompileOnly "org.apache.commons:commons-collections4:4.1"
    kapt "com.google.dagger:dagger-compiler:2.28.1"


    testImplementation "junit:junit:4.13"
    testCompileOnly "com.google.j2objc:j2objc-annotations:1.3"
    testCompileOnly("org.hamcrest:hamcrest-library:1.3") {
        exclude group: "org.hamcrest", module: "hamcrest-core"
    }
    testCompileOnly "org.apache.commons:commons-text:1.10.0"
    androidTestImplementation "androidx.test.ext:junit:1.1.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.2.0"
}
